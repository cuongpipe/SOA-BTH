spring.application.name=jwt-demo
server.port=8080

# Cấu hình kết nối MySQL độc lập cho Auth Service
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate tự tạo bảng users nếu chưa có
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true